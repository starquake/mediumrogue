# Production. Pinned to the immutable digest deploy.yml resolves + verifies;
# the ${IMAGE_DIGEST:?} guard fails the boot loudly if it is unset. No host
# port: SWAG reaches the container by name on the shared `web` network.
services:
  mediumrogue-production:
    image: ${IMAGE_NAME}@${IMAGE_DIGEST:?IMAGE_DIGEST must be set in .env or environment}
    container_name: mediumrogue-production
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - TURN_INTERVAL=4s
      - HEARTBEAT_INTERVAL=15s
      - WORLD_RADIUS=120
      - MONSTER_COUNT=1000
      # World snapshot lives on the named volume: the distroless app
      # filesystem is ephemeral, so a snapshot elsewhere is lost on redeploy.
      - SNAPSHOT_PATH=/data/world.json
      - SNAPSHOT_INTERVAL=60s
    volumes:
      - mediumrogue_production_data:/data
    networks:
      - web
    # Cap the container log (#388). Docker's default json-file driver has no
    # max-size and no max-file, so the log grows until the disk does not.
    # This server is chattier than most: the combat/identity event stream is
    # structured slog output, several lines per resolution, and bubbles
    # resolve on their own clock rather than the 4s world tick.
    #
    # 10m x 3 keeps roughly the last half-hour of a busy fight — enough to
    # read back a session that went wrong, bounded at 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  mediumrogue_production_data:
networks:
  web:
    external: true
