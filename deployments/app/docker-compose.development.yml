# Development. Runs whatever PR carries the deploy:dev label; image is a
# pr-<n> build (unsigned). Separate world + volume; safe to wipe anytime.
services:
  mediumrogue-development:
    image: ${IMAGE_NAME}@${IMAGE_DIGEST:?IMAGE_DIGEST must be set in .env or environment}
    container_name: mediumrogue-development
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - TURN_INTERVAL=4s
      - HEARTBEAT_INTERVAL=15s
      # The big world (#286): radius 120 ≈ 43.6k hexes, ~1 monster per ~44
      # hexes — the density all three envs share. Dev is a throwaway sandbox —
      # a radius change just regenerates its world (snapshot set aside).
      - WORLD_RADIUS=120
      - WORLD_SEED=42
      - MONSTER_COUNT=1000
      # #458 EXPERIMENT — graph-first worldgen knobs. Every one has a sensible
      # default in code; uncomment and restart the container to retune the
      # world without rebuilding the image. Staging still runs the noise
      # generator, so it is the control to compare against.
      #
      # Node counts scale with ring AREA (roughly 1:3:5 at radius 120) — flat
      # counts leave the frontier ring almost entirely impassable.
      # - WORLDGEN_NODES_R0=5
      # - WORLDGEN_NODES_R1=15
      # - WORLDGEN_NODES_R2=26
      # - WORLDGEN_NODE_RADIUS=10     # size of the open area at each node
      # - WORLDGEN_PATH_RADIUS=4      # corridor half-width; 4 => ~9 hexes wide
      # - WORLDGEN_SPUR_RADIUS=6      # size of a dead-end pocket
      # - WORLDGEN_LOOPS=6            # extra links; FEWER means more detour
      # - WORLDGEN_MIN_LOOP_DIST=30   # loops must be long: a short one is a shortcut
      # - WORLDGEN_DEAD_ENDS=10
      # - WORLDGEN_SPUR_LEN=16
      # - WORLDGEN_LAKES=5
      - SNAPSHOT_PATH=/data/world.json
      - SNAPSHOT_INTERVAL=60s
    volumes:
      - mediumrogue_development_data:/data
    networks:
      - web
    # Cap the container log (#388). Docker's default json-file driver has no
    # max-size and no max-file, so the log grows until the disk does not.
    # This server is chattier than most: the combat/identity event stream is
    # structured slog output, several lines per resolution, and bubbles
    # resolve on their own clock rather than the 4s world tick.
    #
    # 10m x 3 keeps roughly the last half-hour of a busy fight — enough to
    # read back a session that went wrong, bounded at 30 MB per service.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  mediumrogue_development_data:
networks:
  web:
    external: true
