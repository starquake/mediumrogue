name: Deploy

# Each environment runs on zoot as its own user, mediumrogue-<env>, with
# rootless Podman: the jobs install deployments/podman's Quadlet unit there
# and restart it (deploy-ssh.sh runs deploy.sh on the server). The server side
# (users, ports, Caddy) is set up by linuxeverywhere-infra; see
# deployments/README.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
  # pull_request_target runs main's copy of this workflow, so a PR cannot
  # rewrite the job that holds the development SSH key.
  pull_request_target:
    branches: [main]
    types: [labeled, synchronize]

env:
  # The package is public, so deploy hosts pull it anonymously.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    # One staging deploy at a time. Without this, a burst of merges fires a
    # Deploy per CI completion and they all SSH into the same directory at
    # once — which is how three of six runs for 731a1a7 failed on 2026-08-06
    # (#387). deploy.sh also takes a lock on the host. NOT cancel-in-progress:
    # a cancelled run can stop between installing the unit and the restart,
    # leaving the host on a half-applied deploy that nothing retries.
    # Queueing is slower and always lands.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.SERVER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.4'

      - name: Resolve image digest
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve a digest for ${IMAGE_REF} (got '${DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify image signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/starquake/mediumrogue/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      # deploy-ssh.sh sends deploy.sh and the unit to the server over SSH and
      # runs it there as the environment's own user: it installs the Quadlet
      # unit, restarts the app and waits for /healthz (deployments/README.md).
      - name: Deploy to staging server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: staging
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/staging.container "$upload/"
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify staging deployment
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1

  deploy-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The startsWith(head_branch, 'v') guard is a tag-vs-branch heuristic:
    # it is safe only because ci.yml's `push` trigger is limited to
    # branches:[main] + tags:['v*.*.*'], so no v-prefixed BRANCH can produce
    # a push-event CI run. Keep that ci.yml filter in lockstep with this.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    # Same guard as staging, and the same reasoning applies harder here:
    # interrupting a production deploy is worse than making it wait (#387).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SERVER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine image tag
        id: tag
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          IMAGE_TAG="${IMAGE_TAG#v}"
          if [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # A manual dispatch runs from a branch (not a tag), so it has no
            # semver to resolve — deploy the newest release via :latest. An
            # automatic tag-push that isn't strict X.Y.Z (e.g. a v*.*.* that
            # matched a prerelease like v1.0.0-rc1) must NOT fall back to
            # :latest: that would silently deploy stale bytes to production.
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              IMAGE_TAG="latest"
            else
              echo "ERROR: '${IMAGE_TAG}' is not a strict semver release tag (X.Y.Z); refusing to deploy to production" >&2
              exit 1
            fi
          fi
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.2.4'

      - name: Resolve image digest
        id: digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve a digest for ${IMAGE_REF} (got '${DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify image signature
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/starquake/mediumrogue/\.github/workflows/ci\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      # deploy-ssh.sh sends deploy.sh and the unit to the server over SSH and
      # runs it there as the environment's own user: it installs the Quadlet
      # unit, restarts the app and waits for /healthz (deployments/README.md).
      - name: Deploy to production server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: production
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/production.container "$upload/"
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify production deployment
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1

  deploy-development:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Label-only. Fires when a same-repo PR carries the deploy:dev label
    # (on adding that label or on any later push while it stays labeled).
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy:dev') &&
      contains(github.event.pull_request.labels.*.name, 'deploy:dev') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Single dev slot. Not cancel-in-progress, for the same reason as staging.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    environment:
      name: development
      url: ${{ vars.SERVER_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Used only as the docker build context; nothing in it runs on the runner.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the PR's code and push a pr-<n> tag. No cosign: development is a
      # throwaway sandbox fed only by the operator's own labeled PRs.
      - name: Build and push PR image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pr
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          # Writes go to their own scope so a PR cannot poison main's build cache.
          cache-from: |
            type=gha
            type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview

      - name: Resolve image digest
        id: digest
        env:
          BUILD_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: build did not return a digest (got '${BUILD_DIGEST}')" >&2
            exit 1
          fi
          echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      # deploy-ssh.sh sends deploy.sh and the unit to the server over SSH and
      # runs it there as the environment's own user: it installs the Quadlet
      # unit, restarts the app and waits for /healthz (deployments/README.md).
      - name: Deploy to development server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_ENV: development
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/upload"
          mkdir -p "$upload"
          cp deployments/podman/deploy.sh deployments/podman/development.container "$upload/"
          bash deployments/podman/deploy-ssh.sh "$upload"

      - name: Verify development deployment
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i/12 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts (60s); failing the deploy" >&2
          exit 1
